<svg width="620" height="160" viewBox="0 0 620 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PULSE logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .word{
        font-family: Fraunces, Georgia, 'Times New Roman', serif;
        font-weight: 500;
        font-size: 84px;
        letter-spacing: 0.5px;
        fill: #EFE9DC;
      }
      .tag{
        font-family: 'IBM Plex Mono', 'Courier New', monospace;
        font-size: 13.5px;
        letter-spacing: 2.2px;
        fill: #8792A0;
      }
    </style>
  </defs>

  <!-- badge -->
  <rect x="4" y="14" width="132" height="132" rx="20" fill="#10151C" stroke="#3ED9A0" stroke-width="2"/>

  <!-- heartbeat trace inside badge -->
  <path d="M18,80 L44,80 L54,80 L62,58 L72,104 L82,80 L96,80 L122,80"
        fill="none" stroke="#3ED9A0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pulse dot -->
  <circle cx="122" cy="80" r="5.5" fill="#3ED9A0"/>
  <circle cx="122" cy="80" r="10" fill="none" stroke="#3ED9A0" stroke-width="1.4" opacity="0.55"/>

  <!-- wordmark -->
  <text x="170" y="102" class="word">PULSE</text>

  <!-- tagline -->
  <text x="172" y="130" class="tag">PERSONNEL &amp; UNIT LIFECYCLE SYSTEM FOR EQUIPMENT</text>
</svg>