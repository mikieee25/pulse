<svg width="620" height="160" viewBox="0 0 620 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PULSE logo, DOE brand colors with tonal texture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- single-hue blue gradient for badge depth — never mixes blue and yellow -->
    <linearGradient id="badgeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#397DFF"/>   <!-- Light pairing -->
      <stop offset="55%" stop-color="#1F5BF6"/>  <!-- Balanced pairing -->
      <stop offset="100%" stop-color="#0016A8"/> <!-- Deep pairing -->
    </linearGradient>

    <!-- fine grid texture, blue-on-blue only -->
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14,0 L0,0 L0,14" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.06"/>
    </pattern>

    <style>
      .word{
        font-family: Fraunces, Georgia, 'Times New Roman', serif;
        font-weight: 500;
        font-size: 84px;
        letter-spacing: 0.5px;
        fill: #0000FE; /* DOE Brand Blue */
      }
      .tag{
        font-family: 'IBM Plex Mono', 'Courier New', monospace;
        font-size: 13.5px;
        letter-spacing: 2.2px;
        fill: #1A1A1A;
      }
    </style>
  </defs>

  <!-- badge: single-hue blue gradient + subtle grid texture -->
  <rect x="4" y="14" width="132" height="132" rx="20" fill="url(#badgeBlue)"/>
  <rect x="4" y="14" width="132" height="132" rx="20" fill="url(#grid)"/>

  <!-- echo trace, Light Yellow, offset slightly behind for a soft trailing-signal feel -->
  <path d="M18,83 L44,83 L54,83 L62,61 L72,107 L82,83 L96,83 L122,83"
        fill="none" stroke="#FFFE77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- primary heartbeat trace, core Yellow -->
  <path d="M18,80 L44,80 L54,80 L62,58 L72,104 L82,80 L96,80 L122,80"
        fill="none" stroke="#FFFF00" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pulse dot, layered tones for depth -->
  <circle cx="122" cy="80" r="11" fill="none" stroke="#FADB09" stroke-width="1.4" opacity="0.5"/>
  <circle cx="122" cy="80" r="6" fill="#FFFF00"/>

  <!-- wordmark -->
  <text x="170" y="102" class="word">PULSE</text>

  <!-- tagline -->
  <text x="172" y="130" class="tag">PERSONNEL &amp; UNIT LIFECYCLE SYSTEM FOR EQUIPMENT</text>
</svg>